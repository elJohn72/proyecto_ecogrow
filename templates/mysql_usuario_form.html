{% extends "base.html" %}

{% block title %}{{ titulo }} - EcoGrow{% endblock %}

{% block content_wrapper %}
    <section class="content-shell fade-in-up">
        <div class="panel-header">
            <div>
                <span class="eyebrow">MySQL · usuarios</span>
                <h1 class="text-4xl font-extrabold tracking-tight text-ink mt-4">{{ titulo }}</h1>
                <p class="page-subtitle mt-3">Formulario conectado a la tabla <code>usuarios</code> en MySQL.</p>
            </div>
        </div>

        {% if errores %}
            <div class="flash-card flash-card--error mt-6">
                {% for error in errores %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="dashboard-panel mt-6">
            <form method="post" class="grid gap-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <label class="block">
                    <span class="mb-2 block text-sm font-semibold text-slate-700">Nombre</span>
                    <input type="text" name="nombre" value="{{ usuario.nombre }}" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3" />
                </label>
                <label class="block">
                    <span class="mb-2 block text-sm font-semibold text-slate-700">Correo electronico</span>
                    <input type="email" name="mail" value="{{ usuario.mail }}" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3" />
                </label>
                <label class="block">
                    <span class="mb-2 block text-sm font-semibold text-slate-700">Contrasena</span>
                    <input type="password" name="password" value="" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3" autocomplete="new-password" />
                    <span class="mt-2 block text-sm text-slate-500">{% if 'Editar' in titulo %}Deja este campo vacio para conservar la contrasena actual.{% else %}Debe tener al menos 8 caracteres.{% endif %}</span>
                </label>
                <div class="hero-actions">
                    <button type="submit" class="site-button site-button--primary">{{ accion }}</button>
                    <a href="{{ url_for('mysql.listar_usuarios_mysql') }}" class="site-button site-button--ghost">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
