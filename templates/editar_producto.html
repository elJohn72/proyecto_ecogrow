{% extends "base.html" %}

{% block title %}Editar Producto - EcoGrow{% endblock %}

{% block content %}
    <h2>Editar producto</h2>
    <form method="post" class="flex flex-col gap-4">
        <label>
            Nombre<br>
            <input type="text" name="nombre" value="{{ producto.nombre }}" required class="w-full border rounded px-2 py-1" />
        </label>
        <label>
            Cantidad<br>
            <input type="number" name="cantidad" min="0" value="{{ producto.cantidad }}" required class="w-full border rounded px-2 py-1" />
        </label>
        <label>
            Precio<br>
            <input type="number" name="precio" step="0.01" min="0" value="{{ producto.precio }}" required class="w-full border rounded px-2 py-1" />
        </label>
        <button type="submit" class="bg-primary text-white px-4 py-2 rounded">Actualizar</button>
    </form>
{% endblock %}
