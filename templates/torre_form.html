{% extends "base.html" %}

{% block title %}Registrar torre - EcoGrow{% endblock %}

{% block content_wrapper %}
    <section class="content-shell fade-in-up">
        <div class="panel-header">
            <div>
                <span class="eyebrow">Torre</span>
                <h1 class="text-4xl font-extrabold tracking-tight text-ink mt-4">{{ titulo }}</h1>
                <p class="page-subtitle mt-3">Completa estos 3 datos para empezar a usar la torre.</p>
            </div>
        </div>

        <div class="dashboard-panel mt-6 simple-form-card">
            <form method="post" class="simple-form-stack">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <label>
                    <span>Codigo de la torre</span>
                    <input type="text" name="codigo_unico" value="{{ torre.codigo_unico }}" required placeholder="ECO-TORRE-001" />
                </label>
                <label>
                    <span>Nombre</span>
                    <input type="text" name="nombre" value="{{ torre.nombre }}" required placeholder="Torre principal" />
                </label>
                <label>
                    <span>Ubicacion</span>
                    <input type="text" name="ubicacion" value="{{ torre.ubicacion }}" required placeholder="Patio, balcon o invernadero" />
                </label>

                {% if errores %}
                    <div class="flash-card flash-card--error">
                        {% for error in errores %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="hero-actions">
                    <button type="submit" class="site-button site-button--primary simple-form-button">{{ accion }}</button>
                    <a href="{{ url_for('torres.torres') }}" class="site-button site-button--ghost simple-form-button">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
