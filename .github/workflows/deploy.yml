name: Deploy VPS kv2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'blueprints/**'
      - 'services/**'
      - 'models/**'
      - 'Conexión/**'
      - 'static/**'
      - 'templates/**'
      - 'deploy/**'
      - 'scripts/deploy_vps.sh'
      - 'requirements.txt'

jobs:
  deploy:
    name: Deploy to Coolify (VPS Andrés Bello)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment Webhook
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          echo "🚀 Notificando a Coolify para iniciar despliegue reproducible..."
          curl -f -X GET "$COOLIFY_WEBHOOK_URL"
          echo "✅ Solicitud de despliegue enviada a Coolify con éxito."

      - name: Notice when Coolify Webhook is managed directly
        if: ${{ env.COOLIFY_WEBHOOK_URL == '' }}
        run: |
          echo "ℹ️ El despliegue de EcoGrow se gestiona en Coolify (Laboratorio Andrés Bello)."
          echo "Para disparar despliegues automatizados desde este workflow, configura COOLIFY_WEBHOOK_URL en GitHub Secrets."
