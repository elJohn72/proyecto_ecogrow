<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoGrow Login Screen</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0077cc",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1b23",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #0077cc15 1px, transparent 0);
            background-size: 32px 32px;
        }
        .leaf-accent {
            position: absolute;
            z-index: -1;
            opacity: 0.05;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative overflow-hidden">
<!-- Subtle Background Pattern & Elements -->
<div class="fixed inset-0 bg-pattern"></div>
<!-- Decorative Abstract Elements (Simulating leaves/tech) -->
<div class="leaf-accent top-[-10%] left-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary/20 blur-[100px]"></div>
<div class="leaf-accent bottom-[-10%] right-[-5%] w-[30vw] h-[30vw] rounded-full bg-primary/10 blur-[80px]"></div>
<!-- Main Navigation (Simplified for Login) -->
<header class="relative z-10 w-full px-6 py-6 lg:px-12 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="text-primary">
<span class="material-symbols-outlined text-4xl">eco</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">EcoGrow</h1>
</div>
<div class="hidden md:flex items-center gap-6">
<a class="text-slate-600 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors" href="#">Sostenibilidad</a>
<a class="text-slate-600 dark:text-slate-400 text-sm font-medium hover:text-primary transition-colors" href="#">Tecnología</a>
<button class="bg-primary/10 text-primary px-4 py-2 rounded-lg text-sm font-semibold hover:bg-primary/20 transition-all">
                Soporte
            </button>
</div>
</header>
<!-- Login Container -->
<main class="flex-1 flex items-center justify-center p-6 relative z-10">
<div class="w-full max-w-[440px]">
<!-- Login Card -->
<div class="glass-card rounded-xl shadow-2xl p-8 md:p-10 flex flex-col gap-8">
<!-- Card Header -->
<div class="text-center">
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold">Bienvenido de nuevo</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Gestiona tu ecosistema hidropónico inteligente</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">mail</span>
<input class="w-full bg-white/50 border border-slate-200 dark:border-slate-700 dark:bg-slate-800/50 rounded-lg py-3 pl-10 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="email" placeholder="nombre@empresa.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold" for="password">Contraseña</label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
<input class="w-full bg-white/50 border border-slate-200 dark:border-slate-700 dark:bg-slate-800/50 rounded-lg py-3 pl-10 pr-12 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary/20 cursor-pointer" id="remember" type="checkbox"/>
<label class="text-slate-600 dark:text-slate-400 text-sm cursor-pointer select-none" for="remember">Recordarme en este equipo</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold py-3.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">science</span>
<span>Modo Demo</span>
</button>
</div>
<!-- Bottom Link -->
<p class="text-center text-slate-500 dark:text-slate-400 text-sm">
                    ¿No tienes una cuenta? 
                    <a class="text-primary font-bold hover:underline" href="#">Regístrate aquí</a>
</p>
</div>
<!-- Footer Small Links -->
<footer class="mt-8 flex flex-wrap justify-center gap-x-6 gap-y-2 px-4">
<a class="text-slate-400 dark:text-slate-500 text-xs hover:text-slate-600 transition-colors" href="#">Privacidad</a>
<a class="text-slate-400 dark:text-slate-500 text-xs hover:text-slate-600 transition-colors" href="#">Términos de Servicio</a>
<a class="text-slate-400 dark:text-slate-500 text-xs hover:text-slate-600 transition-colors" href="#">Seguridad</a>
<span class="text-slate-400 dark:text-slate-500 text-xs">© 2024 EcoGrow Inc.</span>
</footer>
</div>
</main>
<!-- Floating Graphic (Visual interest) -->
<div class="hidden lg:block fixed bottom-12 right-12 w-32 h-32 opacity-20 rotate-12">
<svg class="text-primary fill-current" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M44.7,-76.4C58.1,-69.2,70.1,-59.1,79.6,-46.5C89.1,-33.8,96.2,-18.6,95.7,-3.5C95.2,11.6,87.2,26.5,77.3,39.8C67.4,53.1,55.6,64.8,41.9,73.1C28.2,81.3,12.6,86.1,-2.9,91.1C-18.4,96.1,-33.7,101.3,-47.1,95.9C-60.5,90.5,-72,74.5,-80.4,58.3C-88.8,42.1,-94.1,25.7,-94.9,9.4C-95.7,-6.9,-92.1,-23.1,-84.1,-37.5C-76.1,-51.9,-63.8,-64.5,-49.8,-71.4C-35.8,-78.3,-20.1,-79.5,-2.9,-74.5C14.3,-69.5,28.7,-58.3,44.7,-76.4Z" transform="translate(100 100)"></path>
</svg>
</div>
</body></html>
