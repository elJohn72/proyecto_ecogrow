services:
  - type: web
    name: proyecto-ecogrow
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USE_SOCKET
        value: "false"
      - key: MYSQL_AUTO_CREATE_DATABASE
        value: "false"
      - key: MYSQL_SSL_DISABLED
        value: "true"
      - key: ECOGROW_SENSOR_API_TOKEN
        sync: false
